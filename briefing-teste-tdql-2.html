*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--fundo);color:var(--texto);
  font-family:var(--f-corpo);font-size:20px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit}
button{-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--rg-verde-vivo);outline-offset:2px}

#app{max-width:640px;margin:0 auto;padding:24px 20px 48px;min-height:100vh;display:flex;flex-direction:column}
.tela{display:flex;flex-direction:column;gap:20px;flex:1}

.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.link-discreto{
  background:none;border:none;color:var(--link);font-size:1rem;
  padding:10px 6px;cursor:pointer;text-decoration:underline;
}
.link-continuar-solo{align-self:center;margin-top:4px}

.barra-progresso{height:8px;background:var(--linha);border-radius:99px;overflow:hidden}
.barra-progresso-fill{height:100%;background:var(--base);border-radius:99px;transition:width .25s ease}
.txt-progresso{margin:0;color:var(--texto-2);font-size:1rem}

.cartao{
  background:var(--superficie);border:1px solid var(--linha);border-radius:20px;
  padding:28px 24px;display:flex;flex-direction:column;gap:16px;
}
.titulo-abertura,.titulo-pergunta{
  font-family:var(--f-display);font-weight:600;line-height:var(--lh-titulo);
  color:var(--texto);margin:0;font-size:1.7rem;
}
.paragrafo,.ajuda{margin:0;color:var(--texto);font-size:1.15rem;line-height:1.6}
.ajuda{color:var(--texto-2);font-size:1.05rem}
.aviso-leve{color:var(--alerta)}

.botao-principal,.botao-secundario,.botao-perigo{
  min-height:56px;border-radius:14px;font-weight:600;font-size:1.15rem;
  padding:14px 20px;border:2px solid transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
}
.botao-principal{background:var(--acento);color:var(--acento-sobre)}
.botao-principal:disabled{opacity:.6;cursor:default}
.botao-secundario{background:var(--superficie);color:var(--base);border-color:var(--base)}
.botao-secundario.selecionada{background:var(--base);color:var(--base-texto)}
.botao-perigo{background:var(--rg-terracota);color:var(--rg-creme-claro)}

.lista-dados{display:flex;flex-direction:column;gap:10px}
.linha-dado{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--fundo);border-radius:12px;border:1px solid var(--linha)}
.rotulo-dado{font-size:.95rem;color:var(--texto-2)}
.valor-dado{font-size:1.15rem;font-weight:600}

.opcoes{display:flex;flex-direction:column;gap:12px}
.opcao-botao{width:100%}

.pergunta-explicar{margin:4px 0 0;color:var(--texto-2);font-size:1.05rem}
.modos-resposta{display:flex;gap:10px;flex-wrap:wrap}
.modos-resposta--grande{flex-direction:column}
.modo-botao{
  flex:1 1 0;min-width:100px;min-height:64px;border-radius:14px;
  background:var(--superficie);border:2px solid var(--base);color:var(--base);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:1rem;font-weight:600;cursor:pointer;padding:10px;
}
.modo-botao--destaque{border-color:var(--acento);color:var(--texto);background:var(--rg-ambar-claro);min-height:80px;font-size:1.15rem}
.sub-resposta{display:flex;flex-direction:column;gap:12px}
.gravador{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gravador-ativo{background:var(--fundo);border:1px solid var(--linha);border-radius:14px;padding:14px}
.cronometro{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;color:var(--alerta)}
.botao-gravar{width:auto}
.textarea-resposta{
  width:100%;min-height:120px;border-radius:12px;border:2px solid var(--linha);
  padding:14px;font-size:1.1rem;color:var(--texto);background:var(--fundo);
}
.bloco-texto{display:flex;flex-direction:column;gap:10px}
.bloco-foto .input-foto{width:100%}
input[type=file]{font-size:1rem}

.lista-itens-enviados{display:flex;flex-direction:column;gap:8px}
.item-fila{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:10px;background:var(--superficie);border:1px solid var(--linha);font-size:.98rem}
.item-fila-rotulo{font-weight:600}
.item-fila-status{color:var(--texto-2)}
.status-guardado .item-fila-status{color:var(--ok)}
.status-erro .item-fila-status,.status-perdido .item-fila-status{color:var(--alerta)}

.aviso-problema{border:2px solid var(--alerta);border-radius:14px;padding:14px 16px;background:var(--fundo)}
.aviso-problema .paragrafo{margin:0 0 6px}
.lista-problema{margin:0;padding-left:20px}
.lista-problema .link-discreto{text-align:left;padding:6px 0}
.aviso-erro{color:var(--alerta);font-weight:600}
.rodape-nav{display:flex;flex-direction:column;gap:10px;margin-top:auto}

@media (min-width:720px){
  #app{padding:56px 24px 64px}
  .titulo-abertura,.titulo-pergunta{font-size:2.1rem}
}

    localStorage.setItem(LSKEY, JSON.stringify({
      tela: estado.tela,
      respondidas: estado.respondidas,
      fila: estado.fila,
      rascunhos: estado.rascunhos,
      enviadoEm: estado.enviadoEm || null,
      envioOk: !!estado.envioOk,
    }));
  }catch(e){ /* quota cheia: segue sem travar a página */ }
}

let estado = carregarEstado();
let uiFlags = {};
let pausadoView = false;
const filaViva = {};
// gravador ativo mora FORA de uiFlags: avancar()/voltar() zeram uiFlags e o MediaRecorder
// ficava órfão (áudio perdido em silêncio, achado 29/09 caso Virtut).
let gravadorAtivo = null;
let navegando = false;
const TIMEOUT_PARADA_MS = 15000; // segurança: parada que não conclui nunca trava a tela

// ---------------------------------------------------------------------
// utilitários
// ---------------------------------------------------------------------
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function gerarId(){
  if(window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    const r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function formatarTempo(seg){
  seg = Math.max(0, Math.round(seg || 0));
  const m = Math.floor(seg / 60);
  const s = seg % 60;
  return m + ":" + String(s).padStart(2, "0");
}
function marcarRespondida(chave){
  if(estado.respondidas.indexOf(chave) === -1) estado.respondidas.push(chave);
}
function temAlgoRespondido(chave){
  return estado.respondidas.indexOf(chave) !== -1;
}
function perguntaAtualChave(){
  if(estado.tela >= 0 && estado.tela < CFG.perguntas.length) return CFG.perguntas[estado.tela].chave;
  return null;
}

// ---------------------------------------------------------------------
// fila de envio (retry + backoff por item; nada some em silêncio)
// ---------------------------------------------------------------------
function itemLeve(item){
  const leve = { id:item.id, chave:item.chave, tipo:item.tipo, status:item.status, tentativas:item.tentativas, resumoTexto:item.resumoTexto || "" };
  if(item.payload && typeof item.payload.texto === "string") leve.textoPayload = item.payload.texto;
  else if(item.textoPayload) leve.textoPayload = item.textoPayload;
  return leve;
}
function atualizarItemLeve(item){
  const idx = estado.fila.findIndex(function(i){ return i.id === item.id; });
  if(idx >= 0) estado.fila[idx] = itemLeve(item);
  salvarEstado();
}
function enfileirar(opts){
  const item = {
    id: gerarId(), chave: opts.chave, tipo: opts.tipo, payload: opts.payload || {},
    status: "enviando", tentativas: 0, resumoTexto: opts.resumoTexto || "",
  };
  filaViva[item.id] = item;
  estado.fila.push(itemLeve(item));
  marcarRespondida(item.chave);
  salvarEstado();
  render();
  tentarEnviar(item);
  return item;
}
async function tentarEnviar(item){
  item.status = "enviando";
  atualizarItemLeve(item);
  render();
  try{
    const corpo = Object.assign({ chave:item.chave, tipo:item.tipo, cid:item.id }, item.payload);
    const resp = await fetch(CFG.api_base + "/briefing/" + CFG.token + "/resposta", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    });
    if(!resp.ok) throw new Error("http_" + resp.status);
    const j = await resp.json();
    if(!j || j.ok !== true) throw new Error("resposta_sem_ok");
    item.status = "guardado";
    item.tentativas = 0;
    delete filaViva[item.id];
  }catch(e){
    item.tentativas++;
    item.status = "erro";
    const espera = Math.min(30000, 2000 * Math.pow(2, item.tentativas - 1));
    setTimeout(function(){ if(filaViva[item.id]) tentarEnviar(item); }, espera);
  }
  atualizarItemLeve(item);
  render();
}
// item que NUNCA chegou ao servidor e não tem como reenviar (ex.: gravação vazia): fica visível na fila
function registrarPerdido(chave, tipo, rotulo){
  estado.fila.push({ id: gerarId(), chave: chave, tipo: tipo, status: "perdido", tentativas: 0, resumoTexto: rotulo });
  salvarEstado();
}
// itens perdidos/em erro que não foram substituídos por um guardado posterior do mesmo tipo na mesma pergunta
function itensComProblema(){
  const out = [];
  estado.fila.forEach(function(it, i){
    if(it.status !== "perdido" && it.status !== "erro") return;
    const refeito = estado.fila.some(function(o, j){ return j > i && o.chave === it.chave && o.tipo === it.tipo && o.status === "guardado"; });
    if(!refeito) out.push(it);
  });
  return out;
}
function tituloDaChave(chave){
  const p = CFG.perguntas.find(function(x){ return x.chave === chave; });
  return p ? p.titulo : chave;
}
function blocoProblemas(){
  const probs = itensComProblema();
  if(!probs.length) return "";
  const chaves = [];
  probs.forEach(function(it){ if(chaves.indexOf(it.chave) === -1) chaves.push(it.chave); });
  const n = probs.length;
  return '<div class="aviso-problema" id="aviso-problema">'
    + '<p class="paragrafo"><strong>' + (n === 1 ? "1 resposta não chegou" : n + " respostas não chegaram") + '.</strong> Falta refazer:</p>'
    + '<ul class="lista-problema">' + chaves.map(function(c){
        return '<li><button class="link-discreto" data-refazer="' + esc(c) + '" type="button">' + esc(tituloDaChave(c)) + '</button></li>';
      }).join('') + '</ul>'
    + '</div>';
}
function ligarProblemas(){
  document.querySelectorAll("[data-refazer]").forEach(function(b){
    b.addEventListener("click", function(){
      const idx = CFG.perguntas.findIndex(function(x){ return x.chave === b.getAttribute("data-refazer"); });
      if(idx < 0) return;
      estado.tela = idx; estado.envioOk = false; pausadoView = false; uiFlags = {};
      salvarEstado(); render();
    });
  });
}

function retomarFila(){
  estado.fila.forEach(function(li){
    if(li.status === "guardado") return;
    if((li.tipo === "texto" || li.tipo === "escolha" || li.tipo === "confirma") && li.resumoTexto){
      const item = { id: li.id, chave: li.chave, tipo: li.tipo, payload: { texto: li.textoPayload || li.resumoTexto }, status: "enviando", tentativas: li.tentativas || 0, resumoTexto: li.resumoTexto };
      filaViva[item.id] = item;
      tentarEnviar(item);
      return;
    }
    // áudio/foto não sobrevive a reload (payload não fica no localStorage — evita estourar cota);
    // marcado como "perdido" pra ficar visível, nunca some em silêncio.
    li.status = "perdido";
  });
  salvarEstado();
}
function aguardarFilaVazia(){
  return new Promise(function(resolve){
    (function checar(){
      const pend = estado.fila.filter(function(i){ return i.status !== "guardado" && i.status !== "perdido"; });
      if(pend.length === 0) return resolve();
      setTimeout(checar, 400);
    })();
  });
}

// sincronização com o servidor (GET /estado)

async function sincronizarEstadoServidor(){
  try{
    const r = await fetch(CFG.api_base + "/briefing/" + CFG.token + "/estado");
    if(!r.ok) return;
    const j = await r.json();
    if(j && Array.isArray(j.respondidas)) j.respondidas.forEach(marcarRespondida);
    if(j && j.enviado_em) estado.enviadoEm = j.enviado_em;
    salvarEstado();
    render();
  }catch(e){ /* offline: segue com o que já tem local */ }
}

// ---------------------------------------------------------------------
// compressão de foto (seam __setComprimirImagem pros testes)
// ---------------------------------------------------------------------
function comprimirImagemPadrao(file){
  return new Promise(function(resolve, reject){
    const leitor = new FileReader();
    leitor.onload = function(){
      const img = new Image();
      img.onload = function(){
        const maxLado = 1600;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(w > h && w > maxLado){ h = Math.round(h * maxLado / w); w = maxLado; }
        else if(h >= w && h > maxLado){ w = Math.round(w * maxLado / h); h = maxLado; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        resolve({ base64: dataUrl.split(",")[1], mime: "image/jpeg" });
      };
      img.onerror = function(){ reject(new Error("img_falhou")); };
      img.src = String(leitor.result);
    };
    leitor.onerror = reject;
    leitor.readAsDataURL(file);
  });
}
let comprimirImagemFn = comprimirImagemPadrao;
window.__setComprimirImagem = function(fn){ comprimirImagemFn = fn; };

function blobParaBase64(blob){
  return new Promise(function(resolve, reject){
    const leitor = new FileReader();
    leitor.onload = function(){ resolve(String(leitor.result).split(",")[1] || ""); };
    leitor.onerror = reject;
    leitor.readAsDataURL(blob);
  });
}

// ---------------------------------------------------------------------
// áudio
// ---------------------------------------------------------------------
function suportaGravacao(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
// "audio/webm;codecs=opus" -> "audio/webm" (o servidor e o Groq só precisam do tipo base)
function mimeBase(m){ return String(m || "").split(";")[0].trim().toLowerCase().replace(/^video\//, "audio/"); }
function escolherMime(){
  const candidatos = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg"];
  for(let i = 0; i < candidatos.length; i++){
    const m = candidatos[i];
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  }
  return "";
}
function falhaGravacao(chave){
  // nunca some calado: item "perdido" na fila + mensagem na tela + fallback de arquivo
  registrarPerdido(chave, "audio", "Áudio que não gravou");
  setFlag(chave, { modo:"falar", erroGravacao:true, gravando:false, semPermissao:false, mediaRecorder:null, stream:null, cronometroTimer:null });
}
function finalizarGravacao(g){
  if(g.concluido) return;
  g.concluido = true;
  if(gravadorAtivo === g) gravadorAtivo = null;
  if(g.timer) clearInterval(g.timer);
  if(g.stream && g.stream.getTracks) g.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
  const blob = new Blob(g.chunks, { type: g.mr.mimeType || g.mime || "audio/webm" });
  const duracao = Math.round((Date.now() - g.inicio) / 1000);
  if(g.erro || blob.size === 0){
    falhaGravacao(g.chave);
    g.resolver({ ok:false });
    return;
  }
  setFlag(g.chave, { gravando:false, mediaRecorder:null, stream:null, cronometroTimer:null, erroGravacao:false });
  blobParaBase64(blob).then(function(base64){
    if(!base64){ falhaGravacao(g.chave); g.resolver({ ok:false }); return; }
    // enfileirar() já dispara o POST; só resolvemos depois disso
    enfileirar({
      chave: g.chave, tipo: "audio",
      payload: { dado_base64: base64, mime: mimeBase(blob.type) || "audio/webm", duracao_s: duracao },
      resumoTexto: "Áudio de " + formatarTempo(duracao),
    });
    g.resolver({ ok:true });
  }).catch(function(){
    falhaGravacao(g.chave);
    g.resolver({ ok:false });
  });
}
async function comecarGravacao(chave){
  if(gravadorAtivo) return;
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = escolherMime();
    const mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    const g = { chave:chave, mr:mr, stream:stream, mime:mime, chunks:[], inicio:Date.now(), timer:null, concluido:false, erro:false, resolver:null };
    g.pronto = new Promise(function(res){ g.resolver = res; });
    mr.addEventListener("dataavailable", function(e){ if(e.data && e.data.size > 0) g.chunks.push(e.data); });
    mr.addEventListener("stop", function(){ finalizarGravacao(g); });
    mr.addEventListener("error", function(){
      g.erro = true;
      if(mr.state !== "inactive"){ try{ mr.stop(); }catch(e){ finalizarGravacao(g); } }
      else finalizarGravacao(g);
    });
    mr.start(1000); // timeslice: pedaços chegam durante a fala, não só no fim
    g.timer = setInterval(function(){
      const el = document.getElementById("cronometro-" + chave);
      if(el) el.textContent = formatarTempo(Math.round((Date.now() - g.inicio) / 1000));
    }, 250);
    gravadorAtivo = g;
    setFlag(chave, { gravando:true, mediaRecorder:mr, stream:stream, inicioGravacao:g.inicio, cronometroTimer:g.timer, semPermissao:false, erroGravacao:false });
  }catch(e){
    if(stream && stream.getTracks) stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(x){} });
    setFlag(chave, { modo:"falar", semPermissao:true, gravando:false });
  }
}
// Para o gravador (se houver) e só resolve depois do áudio ENFILEIRADO (o POST já foi disparado).
// Resolve {ok:true} sem gravador; {ok:false} se a gravação falhou (aí a tela NÃO deve mudar).
async function pararGravacaoEAguardar(){
  const g = gravadorAtivo;
  if(!g) return { ok:true, nada:true };
  if(g.mr.state !== "inactive"){
    try{ g.mr.stop(); }catch(e){ g.erro = true; finalizarGravacao(g); }
  }
  let timer = null;
  const limite = new Promise(function(res){ timer = setTimeout(function(){ res({ ok:false, timeout:true }); }, TIMEOUT_PARADA_MS); });
  const r = await Promise.race([g.pronto, limite]);
  clearTimeout(timer);
  if(r && r.timeout && !g.concluido){ g.erro = true; finalizarGravacao(g); return { ok:false }; }
  return r;
}
function pararGravacao(chave){
  pararGravacaoEAguardar();
}
// cliente troca de app / bloqueia / fecha no meio da fala: para e enfileira
function pararPorSaida(){
  if(gravadorAtivo) pararGravacaoEAguardar();
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden") pararPorSaida();
});
window.addEventListener("pagehide", pararPorSaida);
function handleAudioFallback(chave, files){
  if(!files || !files.length) return;
  const file = files[0];
  blobParaBase64(file).then(function(base64){
    enfileirar({
      chave: chave, tipo: "audio",
      payload: { dado_base64: base64, mime: mimeBase(file.type) || "audio/mp4" },
      resumoTexto: "Áudio gravado no celular",
    });
  });
}

// ---------------------------------------------------------------------
// foto
// ---------------------------------------------------------------------
function handleFotos(chave, files){
  if(!files || !files.length) return;
  Array.from(files).forEach(function(file, i){
    comprimirImagemFn(file).then(function(res){
      enfileirar({
        chave: chave, tipo: "foto",
        payload: { dado_base64: res.base64, mime: res.mime },
        resumoTexto: "Foto " + (i + 1),
      });
    }).catch(function(){
      alert("Não consegui preparar essa foto. Pode tentar outra?");
    });
  });
}

// ---------------------------------------------------------------------
// navegação
// ---------------------------------------------------------------------
function setFlag(chave, patch){
  uiFlags[chave] = Object.assign({}, uiFlags[chave] || {}, patch);
  render();
}
function despacharRascunhoPendente(){
  const chave = perguntaAtualChave();
  if(chave && estado.rascunhos[chave] && estado.rascunhos[chave].trim()){
    const texto = estado.rascunhos[chave].trim();
    delete estado.rascunhos[chave];
    enfileirar({ chave:chave, tipo:"texto", payload:{ texto:texto }, resumoTexto: texto.slice(0, 80) });
  }
}
async function comNavegacao(fn){
  if(navegando) return;
  navegando = true;
  try{
    const r = await pararGravacaoEAguardar();
    if(!r.ok) return; // gravação falhou: fica na tela com a mensagem, não deixa passar em silêncio
    fn();
  } finally { navegando = false; }
}
function avancar(){
  return comNavegacao(function(){
    despacharRascunhoPendente();
    if(estado.tela < CFG.perguntas.length - 1) estado.tela++; else estado.tela = CFG.perguntas.length;
    uiFlags = {};
    salvarEstado();
    render();
  });
}
function voltar(){
  return comNavegacao(function(){
    despacharRascunhoPendente();
    if(estado.tela > -1) estado.tela--;
    uiFlags = {};
    salvarEstado();
    render();
  });
}
function continuarDepois(){
  return comNavegacao(function(){
    despacharRascunhoPendente();
    pausadoView = true;
    render();
  });
}
async function finalizarEnvio(){
  const btn = document.getElementById("btn-enviar-final");
  if(btn){ btn.disabled = true; btn.textContent = "Enviando..."; }
  const rp = await pararGravacaoEAguardar();
  if(!rp.ok){ if(btn){ btn.disabled = false; btn.textContent = CFG.fim.botao_enviar; } return; }
  await aguardarFilaVazia();
  try{
    const r = await fetch(CFG.api_base + "/briefing/" + CFG.token + "/enviar", { method: "POST" });
    const j = await r.json().catch(function(){ return {}; });
    if(r.ok && j && j.ok){
      estado.envioOk = true;
      estado.enviadoEm = new Date().toISOString();
      salvarEstado();
      render();
    }else{
      if(btn){ btn.disabled = false; btn.textContent = CFG.fim.botao_enviar; }
      alert("Não consegui enviar agora. Pode tentar de novo?");
    }
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = CFG.fim.botao_enviar; }
    alert("Sem internet agora. Pode tentar de novo?");
  }
}

  });

function painelResposta(chave, modos, destaque){
  const flag = uiFlags[chave] || {};
  const botoes = modos.map(function(modo){
    const icone = modo === "falar" ? ICONE_MIC : modo === "escrever" ? ICONE_LAPIS : ICONE_CAMERA;
    const rotulo = modo === "falar" ? "Falar" : modo === "escrever" ? "Escrever" : "Mandar foto";
    const cls = "modo-botao" + (modo === destaque ? " modo-botao--destaque" : "");
    return '<button class="' + cls + '" data-modo="' + modo + '" data-chave="' + chave + '" type="button">' + icone + '<span>' + rotulo + '</span></button>';
  }).join('');
  const wrapCls = "modos-resposta" + (destaque ? " modos-resposta--grande" : "");
  let sub = "";
  if(flag.modo === "falar") sub = subGravador(chave);
  else if(flag.modo === "escrever") sub = subTexto(chave);
  else if(flag.modo === "foto") sub = subFoto(chave);
  return '<div class="' + wrapCls + '">' + botoes + '</div>'
    + '<div class="sub-resposta" data-chave="' + chave + '">' + sub + '</div>';
}
function subGravador(chave){
  const flag = uiFlags[chave] || {};
  if(flag.erroGravacao){
    return '<div class="gravador gravador-fallback gravador-erro">'
      + '<p class="ajuda aviso-erro" role="alert">Não consegui gravar esse áudio. Tenta de novo, ou grava pelo gravador do celular.</p>'
      + '<button class="botao-secundario botao-gravar" data-acao="comecar-gravacao" data-chave="' + chave + '" type="button">' + ICONE_MIC + ' Tentar de novo</button>'
      + '<input type="file" accept="audio/*" capture class="input-audio-fallback" data-chave="' + chave + '">'
      + '</div>';
  }
  if(flag.semPermissao || !suportaGravacao()){
    return '<div class="gravador gravador-fallback">'
      + '<p class="ajuda">O celular não deixou eu gravar por aqui. Pode gravar pelo gravador de áudio do celular e mandar o arquivo.</p>'
      + '<input type="file" accept="audio/*" capture class="input-audio-fallback" data-chave="' + chave + '">'
      + '</div>';
  }
  if(flag.gravando){
    return '<div class="gravador gravador-ativo">'
      + '<span class="cronometro" id="cronometro-' + chave + '">0:00</span>'
      + '<button class="botao-perigo" data-acao="parar-gravacao" data-chave="' + chave + '" type="button">' + ICONE_STOP + ' Parar</button>'
      + '</div>';
  }
  return '<div class="gravador">'
    + '<button class="botao-secundario botao-gravar" data-acao="comecar-gravacao" data-chave="' + chave + '" type="button">' + ICONE_MIC + ' Toque pra gravar</button>'
    + '</div>';
}
function subTexto(chave){
  const valor = estado.rascunhos[chave] || "";
  return '<div class="bloco-texto">'
    + '<textarea class="textarea-resposta" id="textarea-' + chave + '" data-chave="' + chave + '" rows="4" placeholder="Pode escrever aqui...">' + esc(valor) + '</textarea>'
    + '<button class="botao-secundario" data-acao="guardar-texto" data-chave="' + chave + '" type="button">Guardar</button>'
    + '</div>';
}
function subFoto(chave){
  return '<div class="bloco-foto">'
    + '<input type="file" accept="image/*" multiple class="input-foto" data-chave="' + chave + '">'
    + '</div>';
}
function itemFilaHtml(item){
  const rotulo = item.resumoTexto || (item.tipo === "foto" ? "Foto" : item.tipo === "audio" ? "Áudio" : "Resposta");
  const status = {
    enviando: "enviando...",
    guardado: "guardado ✓",
    erro: "não foi, sem internet? vou tentar de novo",
    perdido: "não chegou — grave de novo",
  }[item.status] || item.status;
  return '<div class="item-fila status-' + item.status + '" data-item="' + item.id + '"><span class="item-fila-rotulo">' + esc(rotulo) + '</span><span class="item-fila-status">' + esc(status) + '</span></div>';
}
function listaFilaDaPergunta(chave){
  const itens = estado.fila.filter(function(i){ return i.chave === chave; });
  if(!itens.length) return "";
  return '<div class="lista-itens-enviados">' + itens.map(itemFilaHtml).join('') + '</div>';
}

function corpoConfirma(p){
  const flag = uiFlags[p.chave] || {};
  return '<div class="lista-dados">'
    + p.dados.map(function(par){ return '<div class="linha-dado"><span class="rotulo-dado">' + esc(par[0]) + '</span><span class="valor-dado">' + esc(par[1]) + '</span></div>'; }).join('')
    + '</div>'
    + '<div class="opcoes opcoes-confirma">'
    + '<button class="botao-secundario botao-certo" data-acao="certo" type="button">' + ICONE_CHECK + ' Tá tudo certo</button>'
    + '<button class="botao-secundario botao-errado" data-acao="errado" type="button">Tem coisa errada</button>'
    + '</div>'
    + (flag.explicarErro ? painelResposta(p.chave, ["falar", "escrever"], null) : "");
}
function corpoEscolha(p){
  const flag = uiFlags[p.chave] || {};
  const selecionada = flag.opcaoSelecionada || null;
  return '<div class="opcoes opcoes-escolha">'
    + p.opcoes.map(function(o){ return '<button class="botao-secundario opcao-botao' + (o === selecionada ? " selecionada" : "") + '" data-opcao="' + esc(o) + '" type="button">' + esc(o) + '</button>'; }).join('')
    + '</div>'
    + '<p class="pergunta-explicar">Quer explicar melhor?</p>'
    + painelResposta(p.chave, ["falar", "escrever", "foto"], null);
}
function corpoPergunta(p){
  if(p.tipo === "confirma") return corpoConfirma(p);
  if(p.tipo === "escolha") return corpoEscolha(p);
  if(p.tipo === "foto") return painelResposta(p.chave, ["foto", "falar", "escrever"], "foto");
  return painelResposta(p.chave, ["falar", "escrever", "foto"], "falar");
}

function telaPergunta(idx){
  const p = CFG.perguntas[idx];
  const total = CFG.perguntas.length;
  const pct = Math.round(((idx + 1) / total) * 100);
  const jaTemAlgo = temAlgoRespondido(p.chave);
  const gravandoAqui = !!(gravadorAtivo && gravadorAtivo.chave === p.chave);
  const rotuloProx = gravandoAqui ? "Parar e seguir" : (jaTemAlgo ? "Próxima" : "Pular esta");
  return '<div class="tela tela-pergunta">'
    + '<div class="topo">'
    + '<button class="link-discreto" id="btn-voltar" type="button">‹ Voltar</button>'
    + '<button class="link-discreto" id="btn-continuar-depois" type="button">Continuar depois</button>'
    + '</div>'
    + '<div class="barra-progresso"><div class="barra-progresso-fill" style="width:' + pct + '%"></div></div>'
    + '<p class="txt-progresso">Pergunta ' + (idx + 1) + ' de ' + total + '</p>'
    + '<div class="cartao">'
    + '<h1 class="titulo-pergunta">' + esc(p.titulo) + '</h1>'
    + (p.ajuda ? '<p class="ajuda">' + esc(p.ajuda) + '</p>' : '')
    + corpoPergunta(p)
    + '</div>'
    + listaFilaDaPergunta(p.chave)
    + '<div class="rodape-nav">'
    + '<button class="botao-principal" id="btn-prox" type="button">' + rotuloProx + '</button>'
    + '</div>'
    + '</div>';
}
function ligarPergunta(idx){
  const p = CFG.perguntas[idx];
  document.getElementById("btn-voltar").addEventListener("click", voltar);
  document.getElementById("btn-continuar-depois").addEventListener("click", continuarDepois);
  document.getElementById("btn-prox").addEventListener("click", avancar);

  if(p.tipo === "confirma"){
    const btnCerto = document.querySelector('[data-acao="certo"]');
    const btnErrado = document.querySelector('[data-acao="errado"]');
    if(btnCerto) btnCerto.addEventListener("click", function(){
      enfileirar({ chave:p.chave, tipo:"confirma", payload:{ texto:"Tá tudo certo" }, resumoTexto:"Confirmado: tá tudo certo" });
    });
    if(btnErrado) btnErrado.addEventListener("click", function(){
      setFlag(p.chave, { explicarErro:true });
    });
  }
  if(p.tipo === "escolha"){
    document.querySelectorAll(".opcao-botao").forEach(function(btn){
      btn.addEventListener("click", function(){
        const opcao = btn.getAttribute("data-opcao");
        setFlag(p.chave, { opcaoSelecionada:opcao });
        enfileirar({ chave:p.chave, tipo:"escolha", payload:{ texto:opcao }, resumoTexto:opcao });
      });
    });
  }
  ligarPainelResposta(p.chave);
}
function ligarPainelResposta(chave){
  document.querySelectorAll('.modo-botao[data-chave="' + chave + '"]').forEach(function(btn){
    btn.addEventListener("click", function(){
      const modo = btn.getAttribute("data-modo");
      // gravando nesta pergunta: tocar em "Falar" de novo não pode esconder o Parar
      if(modo === "falar" && gravadorAtivo && gravadorAtivo.chave === chave) return;
      const atual = (uiFlags[chave] || {}).modo;
      const novo = atual === modo ? null : modo;
      setFlag(chave, { modo: novo });
      // pergunta aberta: "Falar" já começa a gravar (um toque só, como áudio de WhatsApp;
      // evita a cliente falar sem ter apertado gravar). Dentro do mesmo gesto, pro iPhone deixar o microfone.
      const perg = CFG.perguntas.find(function(x){ return x.chave === chave; });
      const fl = uiFlags[chave] || {};
      if(novo === "falar" && perg && perg.tipo === "aberta" && suportaGravacao() && !fl.erroGravacao && !gravadorAtivo){
        comecarGravacao(chave);
      }
    });
  });
  const audioFallback = document.querySelector('.input-audio-fallback[data-chave="' + chave + '"]');
  if(audioFallback) audioFallback.addEventListener("change", function(e){ handleAudioFallback(chave, e.target.files); });

  const botaoComecar = document.querySelector('[data-acao="comecar-gravacao"][data-chave="' + chave + '"]');
  if(botaoComecar) botaoComecar.addEventListener("click", function(){ comecarGravacao(chave); });
  const botaoParar = document.querySelector('[data-acao="parar-gravacao"][data-chave="' + chave + '"]');
  if(botaoParar) botaoParar.addEventListener("click", function(){ pararGravacao(chave); });

  const botaoGuardarTexto = document.querySelector('[data-acao="guardar-texto"][data-chave="' + chave + '"]');
  if(botaoGuardarTexto) botaoGuardarTexto.addEventListener("click", function(){
    const ta = document.getElementById("textarea-" + chave);
    const texto = (ta.value || "").trim();
    if(texto){
      delete estado.rascunhos[chave];
      enfileirar({ chave:chave, tipo:"texto", payload:{ texto:texto }, resumoTexto: texto.slice(0, 80) });
      setFlag(chave, { modo:null });
    }
  });
  const textarea = document.getElementById("textarea-" + chave);
  if(textarea) textarea.addEventListener("input", function(e){
    estado.rascunhos[chave] = e.target.value;
    salvarEstado();
  });

  const inputFoto = document.querySelector('.input-foto[data-chave="' + chave + '"]');
  if(inputFoto) inputFoto.addEventListener("change", function(e){ handleFotos(chave, e.target.files); });
}

function telaPausa(){
  const probs = blocoProblemas();
  return '<div class="tela tela-pausa">'
    + '<div class="cartao">'
    + '<h1 class="titulo-abertura">' + (probs ? "Guardei o que deu." : "Tudo guardado.") + '</h1>'
    + probs
    + '<p class="paragrafo">Pode fechar e voltar por este mesmo link.</p>'
    + '<button class="botao-principal" id="btn-continuar-agora" type="button">Continuar agora</button>'
    + '</div>'
    + '</div>';
}
function ligarPausa(){
  ligarProblemas();
  document.getElementById("btn-continuar-agora").addEventListener("click", function(){
    pausadoView = false; render();
  });
}

function telaFinal(){
  const total = CFG.perguntas.length;
  const probs = blocoProblemas();
  const chavesProb = itensComProblema().map(function(i){ return i.chave; });
  const feitas = estado.respondidas.filter(function(c){ return chavesProb.indexOf(c) === -1; }).length;
  if(estado.envioOk){
    if(probs){
      // nunca dizer "tudo certo" com item faltando
      return '<div class="tela tela-final">'
        + '<div class="cartao">'
        + '<h1 class="titulo-abertura">Recebi quase tudo.</h1>'
        + probs
        + '<p class="paragrafo">Toque numa pergunta acima pra gravar de novo e mandar.</p>'
        + '</div>'
        + '</div>';
    }
    return '<div class="tela tela-final">'
      + '<div class="cartao">'
      + '<h1 class="titulo-abertura">' + esc(CFG.fim.titulo) + '</h1>'
      + CFG.fim.texto.map(function(t){ return '<p class="paragrafo">' + esc(t) + '</p>'; }).join('')
      + '</div>'
      + '</div>';
  }
  return '<div class="tela tela-final">'
    + '<div class="topo">'
    + '<button class="link-discreto" id="btn-voltar-final" type="button">‹ Voltar</button>'
    + '<button class="link-discreto" id="btn-continuar-depois" type="button">Continuar depois</button>'
    + '</div>'
    + '<div class="cartao">'
    + '<h1 class="titulo-abertura">Só falta enviar</h1>'
    + '<p class="paragrafo">Você respondeu ' + feitas + ' de ' + total + ' perguntas.</p>'
    + probs
    + (estado.enviadoEm ? '<p class="paragrafo aviso-leve">Já tinha mandado antes. Pode responder mais e mandar de novo.</p>' : '')
    + '<button class="botao-principal" id="btn-enviar-final" type="button">' + esc(CFG.fim.botao_enviar) + '</button>'
    + '</div>'
    + '</div>';
}
function ligarFinal(){
  ligarProblemas();
  const btn = document.getElementById("btn-enviar-final");
  if(btn) btn.addEventListener("click", finalizarEnvio);
  const btnVoltar = document.getElementById("btn-voltar-final");
  if(btnVoltar) btnVoltar.addEventListener("click", function(){
    estado.tela = CFG.perguntas.length - 1; salvarEstado(); render();
  });
  const btnContinuar = document.getElementById("btn-continuar-depois");
  if(btnContinuar) btnContinuar.addEventListener("click", continuarDepois);
}

function render(){
  const app = document.getElementById("app");
  if(pausadoView){ app.innerHTML = telaPausa(); ligarPausa(); return; }
  if(estado.tela === -1){ app.innerHTML = telaAbertura(); ligarAbertura(); return; }
  if(estado.tela >= 0 && estado.tela < CFG.perguntas.length){ app.innerHTML = telaPergunta(estado.tela); ligarPergunta(estado.tela); return; }
  app.innerHTML = telaFinal(); ligarFinal();
}

function iniciar(){
  retomarFila();
  render();
  sincronizarEstadoServidor();
}

// expostos só pra suíte de testes e pro print de gate visual (navegação/estado sem hardware real)
if(typeof window !== "undefined"){
  window.__briefing = { estado: function(){ return estado; }, render: render, CFG: CFG, uiFlags: function(){ return uiFlags; }, gravador: function(){ return gravadorAtivo; } };
}

iniciar();
})();
</script>
</body>
</html>
