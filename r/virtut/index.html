<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Virtut</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#FAF7F2;color:#1a1816;font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
main{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:20px 22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:0}
.marca{font-family:Georgia,'Times New Roman',serif;font-size:40px;letter-spacing:.12em;margin:0 0 26px;font-weight:400}
h1{font-size:28px;line-height:1.2;margin:0 0 22px;font-weight:400}
.rotulo{font-size:18px;margin:0 0 8px;opacity:.75;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.pergunta{font-size:22px;line-height:1.35;margin:0 0 26px;min-height:6.1em;display:flex;align-items:center;justify-content:center}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;background:#fff;color:#111;border:1.5px solid #1a1816;border-radius:14px;font:600 19px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-decoration:none}
.btn:active{opacity:.85}
.btn svg{flex:none}
button.outra{margin-top:16px;background:none;border:0;color:inherit;font:18px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-decoration:underline;padding:12px 16px;min-height:48px;cursor:pointer;opacity:.85}
.rodape{font-size:18px;margin:14px 0 0;opacity:.7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>
<body>
<main>
<!-- LOGO: substituir quando chegar -->
<div class="marca">Virtut</div>
<h1>Conta pra quem ainda não conhece a Virtut.</h1>
<p class="rotulo">Uma ideia pra começar:</p>
<p class="pergunta" id="pergunta">O que você levou hoje? Conta pra qual ocasião.</p>
<a class="btn" id="botao" href="https://search.google.com/local/writereview?placeid=ChIJEZ4xlXKXpgARcglzFDddNpg"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" aria-hidden="true" viewBox="0 0 24 24" width="24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg><span>Escrever minha avaliação no Google</span></a>
<button type="button" class="outra" id="outra">Outra ideia</button>
<p class="rodape">Escreve do seu jeito. Leva 1 minuto.</p>
<!-- CONTADOR: pendente de decisão -->
</main>
<script>
var PERGUNTAS=["O que você levou hoje? Conta pra qual ocasião.", "Como foi o atendimento? Te ajudaram a achar o que caía bem em você?", "Já escolheu um vestido de festa aqui? Conta como foi.", "Há quanto tempo você compra na Virtut?", "Indicaria a Virtut pra uma amiga que procura loja de roupa feminina em BH? Por quê?", "Qual peça da Virtut você mais usa?"];
var atual=-1;
function sortear(atualIdx,n,rnd){
  if(n<2)return 0;
  var i;
  do{i=Math.floor(rnd()*n);}while(i===atualIdx);
  return i;
}
function mostrar(){
  atual=sortear(atual,PERGUNTAS.length,Math.random);
  document.getElementById("pergunta").textContent=PERGUNTAS[atual];
}
if(typeof document!=="undefined"&&document.getElementById("outra")){
  document.getElementById("outra").addEventListener("click",mostrar);
  mostrar();
}
</script>
</body>
</html>
