<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Nitai Lab — marcação de aparelho</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 18px;
    line-height: 1.4;
    margin: 0 0 12px;
  }
  p {
    font-size: 14px;
    color: #aaa;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  button {
    display: inline-block;
    background: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
  }
  button:active { background: #444; }
  .status { font-size: 13px; color: #6a6; margin-top: 16px; min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="msg">Pronto. Este navegador não conta mais nas propostas da Nitai Lab.</h1>
    <p>Vale pra todas as propostas abertas neste mesmo navegador. Se quiser voltar a ser contado como visita normal, use o botão abaixo.</p>
    <button id="undo">Desfazer</button>
    <div class="status" id="status"></div>
  </div>

<script>
(function(){
  var ENDPOINT = "https://nl-tracker.nitai-amarante.workers.dev";

  function getVid(){
    var v = localStorage.getItem("nl_vid");
    if (!v){
      v = Math.random().toString(36).slice(2,11) + Date.now().toString(36);
      localStorage.setItem("nl_vid", v);
    }
    return v;
  }

  function marcar(){
    localStorage.setItem("nl_owner", "1");
    var vid = getVid();
    document.getElementById("msg").textContent = "Pronto. Este navegador não conta mais nas propostas da Nitai Lab.";
    try {
      fetch(ENDPOINT + "/owner", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({vid: vid}),
        keepalive: true,
      }).then(function(){
        document.getElementById("status").textContent = "Registrado no servidor.";
      }).catch(function(){
        document.getElementById("status").textContent = "Marcado neste navegador (servidor não respondeu — sem problema, a defesa local já vale).";
      });
    } catch(e){
      document.getElementById("status").textContent = "Marcado neste navegador.";
    }
  }

  document.getElementById("undo").addEventListener("click", function(){
    localStorage.removeItem("nl_owner");
    document.getElementById("msg").textContent = "Desfeito. Este navegador volta a contar normalmente.";
    document.getElementById("status").textContent = "";
  });

  marcar();
})();
</script>
</body>
</html>
