:root{
  --pg-fundo:#FBF8F4;       /* fundo da página de aprovação (spec 14/10) */
  --pg-cartao:#FFFFFF;
  --pg-link:#7A3B46;        /* vinho-escuro do kit: 8,6:1 sobre o fundo */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--pg-fundo);color:var(--texto);
  font-family:var(--f-corpo);font-size:18px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;font-size:inherit}
button{-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--vinho);outline-offset:3px}
img{display:block;max-width:100%;height:auto}

#app{max-width:1040px;margin:0 auto;padding:20px 20px 120px}
.coluna{max-width:680px;margin:0}
.logo{display:block;width:150px;height:auto;margin:4px 0 28px}

h1,h2,h3{font-family:var(--f-titulo);font-weight:400;color:var(--texto);margin:0;line-height:1.25;letter-spacing:.01em}
h1{font-size:2rem}
h2{font-size:1.55rem}
h3{font-size:1.35rem}
p{margin:0}
.paragrafo{font-size:1.125rem;line-height:1.65}
.nota{color:var(--texto-2);font-size:1.125rem;margin-top:12px}
.ajuda{color:var(--texto-2);font-size:1.125rem}
.rotulo-pergunta{color:var(--texto-2);font-size:1rem;margin-bottom:6px}

.abertura{padding:8px 0 36px;display:flex;flex-direction:column;gap:16px}

.secao-titulo{margin:12px 0 20px}
.cartoes{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-bottom:56px}
.cartao-jeito{background:var(--pg-cartao);border:1px solid var(--linha);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.cartao-jeito .linha{color:var(--texto);font-size:1.125rem}
.print{display:block;width:100%;max-width:300px;margin:0 auto;padding:0;border:1px solid var(--linha);border-radius:14px;overflow:hidden;background:var(--areia);cursor:zoom-in}
.print img{width:100%;height:auto}
.link-comp{align-self:center;min-height:48px;padding:10px 12px;background:none;border:none;color:var(--pg-link);text-decoration:underline;text-underline-offset:4px;font-size:1.125rem;font-weight:500;cursor:pointer}
.comentario{border-top:1px solid var(--linha);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.comentario .rot{font-weight:500}

.perguntas{display:flex;flex-direction:column;gap:28px}
.bloco-pergunta{background:var(--pg-cartao);border:1px solid var(--linha);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.citacao{margin:0;padding:14px 16px;border-left:4px solid var(--vinho);background:var(--bege-claro);border-radius:0 10px 10px 0;font-size:1.125rem;line-height:1.65}
.respondido{color:var(--ok, #2F6B3A);font-weight:600;font-size:1rem;margin-top:-6px}
.respondido:empty{display:none}

.botao-principal,.botao-secundario,.botao-perigo{
  min-height:56px;border-radius:12px;font-weight:600;font-size:1.125rem;line-height:1.3;
  padding:12px 18px;border:2px solid transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center;
}
.botao-principal{background:var(--vinho);color:#fff}
.botao-principal:hover{background:var(--vinho-escuro)}
.botao-principal:disabled{opacity:.65;cursor:default}
.botao-secundario{background:#fff;color:var(--texto);border-color:var(--vinho)}
.botao-secundario.selecionada{background:var(--vinho);color:#fff}
.botao-perigo{background:var(--vinho-escuro);color:#fff}

.opcoes{display:flex;flex-direction:column;gap:12px}
.opcao-botao{font-weight:500;justify-content:flex-start;text-align:left}
.opcao-botao.selecionada{font-weight:600}
.explicar{margin:4px 0 0;color:var(--texto);font-size:1.125rem;font-weight:500}

.modos-resposta{display:flex;gap:12px;flex-wrap:wrap}
.modo-botao{
  flex:1 1 0;min-width:130px;min-height:56px;border-radius:12px;background:#fff;border:2px solid var(--vinho);color:var(--texto);
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.125rem;font-weight:600;cursor:pointer;padding:10px 14px;
}
.modo-botao.ativo{background:var(--bege-claro)}
.modo-botao--foto{flex-basis:100%}
.sub-resposta{display:flex;flex-direction:column;gap:12px}
.sub-resposta:empty{display:none}
.gravador{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gravador-ativo{background:var(--pg-fundo);border:1px solid var(--linha);border-radius:12px;padding:14px}
.cronometro{font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:700;color:var(--vinho-escuro)}
.textarea-resposta{width:100%;min-height:130px;border-radius:12px;border:2px solid var(--linha);padding:14px;color:var(--texto);background:#fff;font-size:1.125rem;line-height:1.5}
.bloco-texto{display:flex;flex-direction:column;gap:12px}
.aviso-erro{color:var(--vinho-escuro);font-weight:600}
.arquivo{position:relative}
.arquivo input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.arquivo:focus-within{outline:3px solid var(--vinho);outline-offset:3px}
.input-audio-fallback{font-size:1rem;max-width:100%}

.lista-itens-enviados{display:flex;flex-direction:column;gap:8px}
.lista-itens-enviados:empty{display:none}
.item-fila{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:10px;background:var(--pg-fundo);border:1px solid var(--linha);font-size:1rem}
.item-fila-rotulo{font-weight:600;overflow-wrap:anywhere}
.item-fila-status{color:var(--texto-2);white-space:nowrap}
.status-guardado .item-fila-status{color:#2F6B3A;font-weight:600}
.status-erro .item-fila-status,.status-perdido .item-fila-status{color:var(--vinho-escuro);font-weight:600}

.final{margin-top:40px;display:flex;flex-direction:column;gap:16px}
.aviso-problema{border:2px solid var(--vinho);border-radius:12px;padding:14px 16px;background:#fff}
.lista-problema{margin:6px 0 0;padding-left:22px}
.lista-problema .link-comp{min-height:48px;text-align:left;padding:6px 0}
.agradecimento{background:var(--bege-claro);border-radius:16px;padding:24px 20px;font-size:1.25rem;line-height:1.6}

.barra-gravando{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--vinho-escuro);color:#fff;display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.barra-gravando.on{display:flex}
.barra-gravando .cronometro{color:#fff}
.barra-gravando button{min-height:48px;border-radius:10px;border:2px solid #fff;background:#fff;color:var(--vinho-escuro);font-weight:700;padding:8px 18px;cursor:pointer;font-size:1.125rem}

.lb{position:fixed;inset:0;z-index:100;background:#1c1a1a;display:none;flex-direction:column}
.lb.on{display:flex}
.lb-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:#1c1a1a;color:#fff}
.lb-topo p{font-size:1rem;color:#e8e4e1}
.lb-fechar{min-height:56px;min-width:120px;border-radius:12px;border:2px solid #fff;background:#fff;color:#1c1a1a;font-weight:700;font-size:1.125rem;cursor:pointer;padding:8px 20px}
.lb-area{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.lb-area img{margin:auto;max-width:100%;height:auto;cursor:zoom-in}
.lb-area.zoom img{max-width:none;width:auto;cursor:zoom-out}
.lb-area.zoom{display:block}

@media (min-width:900px){
  #app{padding:32px 32px 120px}
  .cartoes{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:2.4rem}
}
</style>
</head>
<body>
<div id="app" role="main"></div>
<div class="barra-gravando" id="barra-gravando" role="status"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
  <div class="lb-topo"><p>Toque na imagem para aumentar ou diminuir.</p><button class="lb-fechar" id="lb-fechar" type="button">Fechar</button></div>
  <div class="lb-area" id="lb-area"></div>
</div>

// ---------------------------------------------------------------------
// estado
// ---------------------------------------------------------------------
function estadoPadrao(){
  return { respondidas:[], fila:[], rascunhos:{}, escolhas:{}, enviadoEm:null, envioOk:false };
}
function carregarEstado(){
  let salvo = null;
  try{ salvo = JSON.parse(localStorage.getItem(LSKEY) || "null"); }catch(e){ salvo = null; }
  const base = estadoPadrao();
  if(!salvo || typeof salvo !== "object") return base;
  return Object.assign(base, salvo);
}
function salvarEstado(){
  try{
    localStorage.setItem(LSKEY, JSON.stringify({
      respondidas: estado.respondidas, fila: estado.fila, rascunhos: estado.rascunhos,
      escolhas: estado.escolhas, enviadoEm: estado.enviadoEm || null, envioOk: !!estado.envioOk,
    }));
  }catch(e){ /* quota cheia: segue sem travar */ }
}
let estado = carregarEstado();
let uiFlags = {};
const filaViva = {};
let gravadorAtivo = null;
const TIMEOUT_PARADA_MS = 15000;

const PERG = {};
CFG.perguntas.forEach(function(p){ PERG[p.chave] = p; });

// ---------------------------------------------------------------------
// utilitários
// ---------------------------------------------------------------------
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function gerarId(){
  if(window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    const r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function formatarTempo(seg){
  seg = Math.max(0, Math.round(seg || 0));
  return Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0");
}
function marcarRespondida(chave){
  if(estado.respondidas.indexOf(chave) === -1) estado.respondidas.push(chave);
}
function bloco(chave){ if(typeof document === "undefined" || !document) return null; return document.querySelector('[data-bloco="' + chave + '"]'); }

// ---------------------------------------------------------------------
// fila de envio (retry + backoff; nada some em silêncio)
// ---------------------------------------------------------------------
function itemLeve(item){
  const leve = { id:item.id, chave:item.chave, tipo:item.tipo, status:item.status, tentativas:item.tentativas, resumoTexto:item.resumoTexto || "" };
  if(item.payload && typeof item.payload.texto === "string") leve.textoPayload = item.payload.texto;
  else if(item.textoPayload) leve.textoPayload = item.textoPayload;
  return leve;
}
function atualizarItemLeve(item){
  const idx = estado.fila.findIndex(function(i){ return i.id === item.id; });
  if(idx >= 0) estado.fila[idx] = itemLeve(item);
  salvarEstado();
}
function enfileirar(opts){
  const item = {
    id: gerarId(), chave: opts.chave, tipo: opts.tipo, payload: opts.payload || {},
    status: "enviando", tentativas: 0, resumoTexto: opts.resumoTexto || "",
  };
  filaViva[item.id] = item;
  estado.fila.push(itemLeve(item));
  marcarRespondida(item.chave);
  estado.envioOk = false; // mexeu depois de mandar: o botão volta
  salvarEstado();
  atualizarTudoLeve();
  tentarEnviar(item);
  return item;
}
async function tentarEnviar(item){
  item.status = "enviando";
  atualizarItemLeve(item);
  atualizarTudoLeve();
  try{
    const corpo = Object.assign({ chave:item.chave, tipo:item.tipo, cid:item.id }, item.payload);
    const resp = await fetch(CFG.api_base + "/briefing/" + CFG.token + "/resposta", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
    });
    if(!resp.ok) throw new Error("http_" + resp.status);
    const j = await resp.json();
    if(!j || j.ok !== true) throw new Error("resposta_sem_ok");
    item.status = "guardado";
    item.tentativas = 0;
    delete filaViva[item.id];
  }catch(e){
    item.tentativas++;
    item.status = "erro";
    const espera = Math.min(30000, 2000 * Math.pow(2, item.tentativas - 1));
    setTimeout(function(){ if(filaViva[item.id]) tentarEnviar(item); }, espera);
  }
  atualizarItemLeve(item);
  atualizarTudoLeve();
}
function registrarPerdido(chave, tipo, rotulo){
  estado.fila.push({ id: gerarId(), chave: chave, tipo: tipo, status: "perdido", tentativas: 0, resumoTexto: rotulo });
  salvarEstado();
  atualizarTudoLeve();
}
function itensComProblema(){
  const out = [];
  estado.fila.forEach(function(it, i){
    if(it.status !== "perdido" && it.status !== "erro") return;
    const refeito = estado.fila.some(function(o, j){ return j > i && o.chave === it.chave && o.tipo === it.tipo && o.status === "guardado"; });
    if(!refeito) out.push(it);
  });
  return out;
}
function retomarFila(){
  estado.fila.forEach(function(li){
    if(li.status === "guardado") return;
    if((li.tipo === "texto" || li.tipo === "escolha") && li.resumoTexto){
      const item = { id: li.id, chave: li.chave, tipo: li.tipo, payload: { texto: li.textoPayload || li.resumoTexto }, status: "enviando", tentativas: li.tentativas || 0, resumoTexto: li.resumoTexto };
      filaViva[item.id] = item;
      tentarEnviar(item);
      return;
    }
    li.status = "perdido"; // áudio/foto não sobrevive a recarregar: fica visível
  });
  salvarEstado();
}
function aguardarFilaVazia(){
  return new Promise(function(resolve){
    (function checar(){
      const pend = estado.fila.filter(function(i){ return i.status !== "guardado" && i.status !== "perdido"; });
      if(pend.length === 0) return resolve();
      setTimeout(checar, 400);
    })();
  });
}
// rascunhos de texto que ela digitou e não tocou em Guardar: nunca se perdem
function despacharRascunhos(){
  Object.keys(estado.rascunhos).forEach(function(chave){
    const t = (estado.rascunhos[chave] || "").trim();
    delete estado.rascunhos[chave];
    if(t) enfileirar({ chave:chave, tipo:"texto", payload:{ texto:t }, resumoTexto:t.slice(0, 80) });
  });
  salvarEstado();
}

async function sincronizarEstadoServidor(){
  try{
    const r = await fetch(CFG.api_base + "/briefing/" + CFG.token + "/estado");
    if(!r.ok) return;
    const j = await r.json();
    if(j && Array.isArray(j.respondidas)) j.respondidas.forEach(function(c){ if(PERG[c]) marcarRespondida(c); });
    const temDestaPagina = j && Array.isArray(j.respondidas) && j.respondidas.some(function(c){ return !!PERG[c]; });
    if(j && j.enviado_em && temDestaPagina) estado.enviadoEm = j.enviado_em;
    salvarEstado();
    atualizarTudoLeve();
  }catch(e){ /* offline: segue local */ }
}

function comprimirImagemPadrao(file){
  return new Promise(function(resolve, reject){
    const leitor = new FileReader();
    leitor.onload = function(){
      const img = new Image();
      img.onload = function(){
        const maxLado = 1600;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(w > h && w > maxLado){ h = Math.round(h * maxLado / w); w = maxLado; }
        else if(h >= w && h > maxLado){ w = Math.round(w * maxLado / h); h = maxLado; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve({ base64: canvas.toDataURL("image/jpeg", 0.8).split(",")[1], mime: "image/jpeg" });
      };
      img.onerror = function(){ reject(new Error("img_falhou")); };
      img.src = String(leitor.result);
    };
    leitor.onerror = reject;
    leitor.readAsDataURL(file);
  });
}
let comprimirImagemFn = comprimirImagemPadrao;
window.__setComprimirImagem = function(fn){ comprimirImagemFn = fn; };
function blobParaBase64(blob){
  return new Promise(function(resolve, reject){
    const leitor = new FileReader();
    leitor.onload = function(){ resolve(String(leitor.result).split(",")[1] || ""); };
    leitor.onerror = reject;
    leitor.readAsDataURL(blob);
  });
}
function handleFotos(chave, files){
  if(!files || !files.length) return;
  Array.from(files).forEach(function(file, i){
    comprimirImagemFn(file).then(function(res){
      enfileirar({ chave:chave, tipo:"foto", payload:{ dado_base64:res.base64, mime:res.mime }, resumoTexto:"Foto " + (i + 1) });
    }).catch(function(){ alert("Não consegui preparar essa foto. Pode tentar outra?"); });
  });
}

function suportaGravacao(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function mimeBase(m){ return String(m || "").split(";")[0].trim().toLowerCase().replace(/^video\//, "audio/"); }
function escolherMime(){
  const candidatos = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg"];
  for(let i = 0; i < candidatos.length; i++){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidatos[i])) return candidatos[i];
  }
  return "";
}
function falhaGravacao(chave){
  registrarPerdido(chave, "audio", "Áudio que não gravou");
  setFlag(chave, { modo:"falar", erroGravacao:true, gravando:false, semPermissao:false });
}
function finalizarGravacao(g){
  if(g.concluido) return;
  g.concluido = true;
  if(gravadorAtivo === g) gravadorAtivo = null;
  if(g.timer) clearInterval(g.timer);
  if(g.stream && g.stream.getTracks) g.stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
  const blob = new Blob(g.chunks, { type: g.mr.mimeType || g.mime || "audio/webm" });
  const duracao = Math.round((Date.now() - g.inicio) / 1000);
  atualizarBarraGravando();
  if(g.erro || blob.size === 0){ falhaGravacao(g.chave); g.resolver({ ok:false }); return; }
  setFlag(g.chave, { gravando:false, erroGravacao:false });
  blobParaBase64(blob).then(function(base64){
    if(!base64){ falhaGravacao(g.chave); g.resolver({ ok:false }); return; }
    enfileirar({
      chave: g.chave, tipo: "audio",
      payload: { dado_base64: base64, mime: mimeBase(blob.type) || "audio/webm", duracao_s: duracao },
      resumoTexto: "Áudio de " + formatarTempo(duracao),
    });
    g.resolver({ ok:true });
  }).catch(function(){ falhaGravacao(g.chave); g.resolver({ ok:false }); });
}
async function comecarGravacao(chave){
  if(gravadorAtivo){
    if(gravadorAtivo.chave === chave) return;
    await pararGravacaoEAguardar(); // gravando em outra pergunta: fecha e envia aquela antes
  }
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = escolherMime();
    const mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    const g = { chave:chave, mr:mr, stream:stream, mime:mime, chunks:[], inicio:Date.now(), timer:null, concluido:false, erro:false, resolver:null };
    g.pronto = new Promise(function(res){ g.resolver = res; });
    mr.addEventListener("dataavailable", function(e){ if(e.data && e.data.size > 0) g.chunks.push(e.data); });
    mr.addEventListener("stop", function(){ finalizarGravacao(g); });
    mr.addEventListener("error", function(){
      g.erro = true;
      if(mr.state !== "inactive"){ try{ mr.stop(); }catch(e){ finalizarGravacao(g); } }
      else finalizarGravacao(g);
    });
    mr.start(1000);
    g.timer = setInterval(function(){
      const t = formatarTempo(Math.round((Date.now() - g.inicio) / 1000));
      document.querySelectorAll(".cronometro").forEach(function(el){ el.textContent = t; });
    }, 250);
    gravadorAtivo = g;
    setFlag(chave, { gravando:true, semPermissao:false, erroGravacao:false });
    atualizarBarraGravando();
  }catch(e){
    if(stream && stream.getTracks) stream.getTracks().forEach(function(t){ try{ t.stop(); }catch(x){} });
    setFlag(chave, { modo:"falar", semPermissao:true, gravando:false });
  }
}
async function pararGravacaoEAguardar(){
  const g = gravadorAtivo;
  if(!g) return { ok:true, nada:true };
  if(g.mr.state !== "inactive"){
    try{ g.mr.stop(); }catch(e){ g.erro = true; finalizarGravacao(g); }
  }
  let timer = null;
  const limite = new Promise(function(res){ timer = setTimeout(function(){ res({ ok:false, timeout:true }); }, TIMEOUT_PARADA_MS); });
  const r = await Promise.race([g.pronto, limite]);
  clearTimeout(timer);
  if(r && r.timeout && !g.concluido){ g.erro = true; finalizarGravacao(g); return { ok:false }; }
  return r;
}
function pararPorSaida(){
  if(gravadorAtivo) pararGravacaoEAguardar();
  despacharRascunhos();
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") pararPorSaida(); });
window.addEventListener("pagehide", pararPorSaida);
function handleAudioFallback(chave, files){
  if(!files || !files.length) return;
  const file = files[0];
  blobParaBase64(file).then(function(base64){
    enfileirar({ chave:chave, tipo:"audio", payload:{ dado_base64:base64, mime:mimeBase(file.type) || "audio/mp4" }, resumoTexto:"Áudio gravado no celular" });
  });
}
function atualizarBarraGravando(){
  const el = document.getElementById("barra-gravando");
  if(gravadorAtivo){
    el.classList.add("on");
    el.innerHTML = '<span>Gravando <span class="cronometro">' + formatarTempo((Date.now() - gravadorAtivo.inicio) / 1000) + '</span></span>'
      + '<button type="button" id="barra-parar">Parar</button>';
    document.getElementById("barra-parar").addEventListener("click", function(){ pararGravacaoEAguardar(); });
  }else{
    el.classList.remove("on");
    el.innerHTML = "";
  }
}

function ligarBloco(el, chave){
  const p = PERG[chave];
  el.querySelectorAll(".opcao-botao").forEach(function(btn){
    btn.addEventListener("click", function(){
      const opcao = btn.getAttribute("data-opcao");
      estado.escolhas[chave] = opcao;
      enfileirar({ chave:chave, tipo:"escolha", payload:{ texto:opcao }, resumoTexto:opcao });
      atualizarBloco(chave);
    });
  });
  el.querySelectorAll(".modo-botao[data-modo]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const modo = btn.getAttribute("data-modo");
      if(modo === "falar" && gravadorAtivo && gravadorAtivo.chave === chave) return;
      const atual = (uiFlags[chave] || {}).modo;
      const novo = atual === modo ? null : modo;
      setFlag(chave, { modo: novo });
      // pergunta aberta: "Falar" já começa a gravar num toque só (como áudio de WhatsApp)
      const fl = uiFlags[chave] || {};
      if(novo === "falar" && p && p.tipo === "aberta" && suportaGravacao() && !fl.erroGravacao){
        comecarGravacao(chave);
      }
    });
  });
  const fb = el.querySelector('.input-audio-fallback');
  if(fb) fb.addEventListener("change", function(e){ handleAudioFallback(chave, e.target.files); });
  const bc = el.querySelector('[data-acao="comecar-gravacao"]');
  if(bc) bc.addEventListener("click", function(){ comecarGravacao(chave); });
  const bp = el.querySelector('[data-acao="parar-gravacao"]');
  if(bp) bp.addEventListener("click", function(){ pararGravacaoEAguardar(); });
  const bg = el.querySelector('[data-acao="guardar-texto"]');
  if(bg) bg.addEventListener("click", function(){
    const ta = document.getElementById("textarea-" + chave);
    const texto = (ta.value || "").trim();
    delete estado.rascunhos[chave];
    if(texto){
      enfileirar({ chave:chave, tipo:"texto", payload:{ texto:texto }, resumoTexto:texto.slice(0, 80) });
      setFlag(chave, { modo:null });
    }
  });
  const ta = el.querySelector(".textarea-resposta");
  if(ta) ta.addEventListener("input", function(e){ estado.rascunhos[chave] = e.target.value; salvarEstado(); });
  const inf = el.querySelector(".input-foto");
  if(inf) inf.addEventListener("change", function(e){ handleFotos(chave, e.target.files); });
}

function tituloDaChave(chave){ return PERG[chave] ? PERG[chave].titulo : chave; }

function atualizarFinal(){

      + '<button class="botao-principal" id="btn-enviar-final" type="button">' + esc(CFG.fim.botao_enviar) + '</button>';
  }
  if(z.getAttribute("data-html") === html) return; // não mexe no DOM sem mudança (foco, clique em andamento)
  z.setAttribute("data-html", html);

  if(btn) btn.addEventListener("click", finalizarEnvio);

      const el = bloco(b.getAttribute("data-refazer"));
      if(el && el.scrollIntoView) el.scrollIntoView({ block:"start" });
    });
  });

async function finalizarEnvio(){
  const btn = document.getElementById("btn-enviar-final");
  if(btn){ btn.disabled = true; btn.textContent = "Enviando..."; }
  const reabilitar = function(){ const b = document.getElementById("btn-enviar-final"); if(b){ b.disabled = false; b.textContent = CFG.fim.botao_enviar; } };
  const rp = await pararGravacaoEAguardar();
  if(!rp.ok){ reabilitar(); return; }
  despacharRascunhos();
  await aguardarFilaVazia();
  try{
    const r = await fetch(CFG.api_base + "/briefing/" + CFG.token + "/enviar", { method: "POST" });
    const j = await r.json().catch(function(){ return {}; });
    if(r.ok && j && j.ok){
      estado.envioOk = true;
      estado.enviadoEm = new Date().toISOString();
      salvarEstado();
      atualizarFinal();
      const z = document.getElementById("final");
      if(z && z.scrollIntoView) z.scrollIntoView({ block:"center" });
    }else{
      atualizarFinal(); reabilitar();
      alert("Não consegui enviar agora. Pode tentar de novo?");
    }
  }catch(e){
    atualizarFinal(); reabilitar();
    alert("Sem internet agora. Pode tentar de novo?");
  }
}

  const cartoes = CFG.cartoes;
  const perguntas = CFG.perguntas.filter(function(p){ return !p.cartao; });
  const logo = CFG.logo_src ? '<img class="logo" src="' + CFG.logo_src + '" alt="Virtut" width="150">' : '';
  const html = ''
    + '<div class="coluna abertura">' + logo
    + '<h1>' + esc(a.titulo) + '</h1>'
    + a.texto.map(function(t){ return '<p class="paragrafo">' + esc(t) + '</p>'; }).join('')
    + (a.nota ? '<p class="nota">' + esc(a.nota) + '</p>' : '')
    + '</div>'
    + '<h2 class="secao-titulo coluna">' + esc(CFG.secao_cartoes) + '</h2>'
    + '<div class="cartoes">' + cartoes.map(htmlCartao).join('') + '</div>'
    + '<div class="coluna perguntas">' + perguntas.map(function(p, i){ return htmlPergunta(p, i + 1, perguntas.length); }).join('') + '</div>'
    + '<div class="coluna final" id="final"></div>';
  document.getElementById("app").innerHTML = html;
  Object.keys(PERG).forEach(atualizarBloco);
  document.querySelectorAll("[data-ampliar]").forEach(function(b){
    b.addEventListener("click", function(){ abrirImagem(b.getAttribute("data-ampliar"), b.getAttribute("data-alt")); });
  });
  atualizarFinal();
}
document.getElementById("lb-fechar").addEventListener("click", function(){ fecharImagem(); });

function iniciar(){
  montar();
  retomarFila();
  despacharRascunhos();
  atualizarTudoLeve();
  sincronizarEstadoServidor();
}

if(typeof window !== "undefined"){
  window.__aprovacao = { estado: function(){ return estado; }, CFG: CFG, uiFlags: function(){ return uiFlags; }, gravador: function(){ return gravadorAtivo; }, lightbox: function(){ return lbAberto; } };
}
iniciar();
})();
</script>
</body>
</html>
